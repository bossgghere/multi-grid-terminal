name: Release GridTerm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift and Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Run Test Suite
        run: |
          swift test

      - name: Build DMG Installer
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_dmg.sh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/GridTerm.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
